name: CI

# Runs on pull requests, weekly (to catch new CVEs in the Alpine packages), manually,
# and as the first stage of the release workflow.
on:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pre-commit version: .github/requirements-ci.txt (Dependabot)
      - name: Install pre-commit
        run: pipx install "$(grep -E '^pre-commit==' .github/requirements-ci.txt)"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The hooks of .pre-commit-config.yaml (actionlint, shellcheck, file checks), exactly as locally.
      # Also fails if a hook revision doesn't exist (e.g. a broken Dependabot update). hadolint runs
      # separately: the hadolint-docker hook uses the untagged image, hadolint-action a pinned version.
      - name: pre-commit
        env:
          SKIP: hadolint-docker
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Lint Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the arm64 image runs apk, so it needs emulation
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # same platforms as the release; multi-platform images can't be loaded into the local docker daemon
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # amd64 image from cache, loaded for the tests and the Trivy scan
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: postfix:ci
          cache-from: type=gha

      - name: Check image
        run: |
          docker run --rm postfix:ci postconf -h mail_version
          # lmdb is the map type of the credentials, liblogin the SASL mechanism LOGIN (PLAIN is built in)
          docker run --rm postfix:ci postconf -m | grep -qx lmdb
          docker run --rm postfix:ci sh -c 'ls /usr/lib/sasl2/ | grep -q liblogin'
          # without the required settings the container must fail instead of starting an unconfigured relay
          if docker run --rm postfix:ci; then
            echo "::error::the container started without TX_SMTP_RELAY_HOST"
            exit 1
          fi

      # relays a mail through Mailpit (STARTTLS + SASL), checks the open-relay protection, logging and SIGTERM
      - name: End-to-end test
        run: .github/ci/e2e.sh postfix:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: postfix:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # reporting only (Security tab); findings are in Alpine packages and fixed by the next rebuild
          exit-code: '0'

      - name: Upload Trivy results
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy
