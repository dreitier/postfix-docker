name: Release

# On every push to main (i.e. every merged PR):
# 1. run the full CI pipeline
# 2. semantic-release (dreitier/shared-ci-components/semantic-release, its default config) derives the next
#    version from the Conventional Commits since the last tag, updates CHANGELOG.md, pushes the release
#    commit + tag and creates the GitHub release.
#    Nothing happens if there are only non-releasing commits (docs, ci, chore, ...).
# 3. the multi-arch image is pushed to Docker Hub and GHCR, signed with cosign and attested.
#    Its CycloneDX SBOM goes to Dependency-Track (secret DEPENDENCYTRACK_API_KEY). Trivy, SBOM, upload and
#    signing come from dreitier/shared-ci-components.
# 4. dreitier/helm-charts is notified (repository_dispatch postfix-released) to update the postfix chart.
on:
  push:
    branches:
      - main
  # re-run a release attempt manually, e.g. after a failed publish
  workflow_dispatch:

permissions:
  contents: read

# never run two releases at the same time, and never cancel one halfway
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  semantic-release:
    name: Version & GitHub release
    needs: ci
    runs-on: ubuntu-latest
    # all writes use the GitHub App token, which may bypass the branch protection of main
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # checkout, release tooling, bot identity and the default config come with the action
      # (tag x.y.z, CHANGELOG.md, GitHub release without PR comments)
      - name: Run semantic-release
        id: release
        uses: dreitier/shared-ci-components/semantic-release@1ba590342248df7855a136be3420378586d139d6 # v1.2.0
        with:
          app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # exactly the existing header of CHANGELOG.md – another title would be added on top of it
          changelog-title: "# Changelog\n\nAll notable changes to this project are documented in this file. It is generated by [semantic-release](https://github.com/semantic-release/semantic-release) from [Conventional Commits](https://www.conventionalcommits.org/) and follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html). Versions up to 0.4.0 were released without a changelog."

  image:
    name: Docker image
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3 -> 1.2.3, 1.2, 1, latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            dreitier/postfix
            ghcr.io/dreitier/postfix
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      # keyless Sigstore signatures (GitHub OIDC identity of this workflow), verifiable with `cosign verify`;
      # the provenance comes from actions/attest-build-provenance below
      - name: Sign images
        uses: dreitier/shared-ci-components/cosign-sign@1ba590342248df7855a136be3420378586d139d6 # v1.2.0
        with:
          images: |
            index.docker.io/dreitier/postfix
            ghcr.io/dreitier/postfix
          digest: ${{ steps.build.outputs.digest }}

      - name: Attest image on Docker Hub
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/dreitier/postfix
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest image on GHCR
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dreitier/postfix
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # CycloneDX SBOM of the released image → Dependency-Track (project postfix, version = release). A separate
  # job: a Dependency-Track outage must not block the Helm chart update. The image is public – no login.
  sbom:
    name: SBOM → Dependency-Track
    needs: [semantic-release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate SBOM
        id: sbom
        uses: dreitier/shared-ci-components/sbom@1ba590342248df7855a136be3420378586d139d6 # v1.2.0
        with:
          image: ghcr.io/dreitier/postfix@${{ needs.image.outputs.digest }}

      - name: Upload to Dependency-Track
        uses: dreitier/shared-ci-components/dependency-track-upload@1ba590342248df7855a136be3420378586d139d6 # v1.2.0
        with:
          api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          bom: ${{ steps.sbom.outputs.file }}
          project-name: postfix
          project-version: ${{ needs.semantic-release.outputs.version }}

  # helm-charts opens a PR that updates the postfix chart to this version
  # (.github/workflows/update-postfix.yaml there, same as update-backmon.yaml)
  helm-chart:
    name: Trigger Helm chart update
    needs: [semantic-release, image]
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create GitHub App token for dreitier/helm-charts
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: dreitier
          repositories: helm-charts
          # repository_dispatch requires write access to the repository contents
          permission-contents: write

      - name: Send repository_dispatch to dreitier/helm-charts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          gh api --method POST repos/dreitier/helm-charts/dispatches \
            -f event_type=postfix-released \
            -f "client_payload[version]=${VERSION}"
          echo "Requested Helm chart update to postfix image ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
